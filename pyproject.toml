[project]
name = "citepred"
version = "0.1.0"
description = "Citation (link) prediction on a scholarly knowledge graph with text, author and graph features: TF-IDF, SBERT, SVD, PageRank, LightGBM"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Evangelos Tempelopoulos" }]
dependencies = [
  "numpy",
  "pandas",
  "scipy",
  "scikit-learn",
  "lightgbm",
  "matplotlib",
]

[project.optional-dependencies]
sbert = ["sentence-transformers", "torch"]
dev = ["networkx", "nbformat", "nbconvert", "ipykernel"]

[project.scripts]
citepred = "citepred.cli:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
